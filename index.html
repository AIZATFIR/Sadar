<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SADAR — Way of Life</title>
  <meta name="description" content="Sadar makes you conscious of how you spend your day, then helps you act on it. Standalone Way of Life habit and mindfulness companion." />
  
  <!-- Apple & PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sadar" />
  <meta name="theme-color" content="#121219" />
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Fonts: Plus Jakarta Sans (UI), Playfair Display (Quotes), JetBrains Mono (Clock/Timer) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgPrimary: '#121219',
            bgSecondary: '#16161F',
            surface: '#21212B',
            surfaceBorder: '#2E2E3D',
            gold: '#D4A359',
            goldLight: '#E5B869',
            textPrimary: '#F3F4F6',
            textMuted: '#9CA3AF',
            statusSuccess: '#22C55E',
            statusSkip: '#3B82F6',
            statusFail: '#EF4444',
            statusNote: '#EAB308',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            serif: ['"Playfair Display"', '"Instrument Serif"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Apple Fluid Feel & Touch Feedback */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }
    /* Spring-eased press: snappier press, slight overshoot on release (tactile) */
    .apple-press {
      transition: transform 90ms cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 90ms ease;
    }
    .apple-press:active {
      transform: scale(0.95);
      opacity: 0.9;
    }
    /* Spring easing override for fixed-duration Tailwind transitions (no layout change) */
    .transition-all.duration-500,
    .transition-all.duration-700,
    .transition-all.duration-1000,
    .transition-colors {
      transition-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
    }
    .transition-all.duration-500 { transition-duration: 400ms !important; }
    .transition-all.duration-700 { transition-duration: 500ms !important; }
    .transition-all.duration-1000 { transition-duration: 600ms !important; }
    /* Compositor hint for the animated timer ring (transform-only, no layout impact) */
    #timer-progress-circle { will-change: transform; }
    .apple-glass {
      background: rgba(33, 33, 43, 0.78);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .apple-glass-gold {
      background: rgba(212, 163, 89, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 163, 89, 0.35);
    }
    .apple-glass-dock {
      background: rgba(22, 22, 31, 0.88);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    /* Hide scrollbars smoothly */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-bgPrimary text-textPrimary antialiased min-h-screen flex justify-center selection:bg-gold/30">

  <!-- Mobile-First Responsive App Container -->
  <div id="app" class="w-full max-w-[430px] min-h-screen bg-bgSecondary text-textPrimary relative flex flex-col pb-28 shadow-2xl border-x border-surfaceBorder/60">

    <!-- Top Fixed Navigation Bar -->
    <header class="sticky top-0 z-40 w-full apple-glass-dock px-5 py-3.5 flex items-center justify-between border-b border-surfaceBorder/40">
      <div class="w-8"></div> <!-- Spacer for center balance -->
      <div class="flex flex-col items-center cursor-pointer" onclick="appState.switchTab('today')">
        <h1 class="text-xl font-extrabold tracking-[0.25em] text-textPrimary uppercase drop-shadow-sm">SADAR</h1>
        <span class="text-[10px] font-medium tracking-widest uppercase text-gold -mt-0.5">Way of Life</span>
      </div>
      <div class="flex items-center space-x-2 w-8 justify-end">
        <button onclick="appState.openPhilosophyModal()" class="w-8 h-8 rounded-full apple-glass flex items-center justify-center text-textMuted hover:text-gold apple-press" title="Filosofi Sadar">
          <i data-lucide="info" class="w-4 h-4"></i>
        </button>
        <button onclick="appState.openAddHabitModal()" class="w-8 h-8 rounded-full bg-gold/20 text-gold border border-gold/40 flex items-center justify-center hover:bg-gold/30 apple-press" title="Tambah Kebiasaan">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="tab-content" class="flex-1 px-4 py-4 overflow-y-auto no-scrollbar">
      <!-- Injected by JavaScript based on active tab -->
    </main>

    <!-- Sticky Bottom Navigation Bar (4 Main Tabs) -->
    <nav class="fixed bottom-0 max-w-[430px] w-full z-40 apple-glass-dock px-3 py-2 flex items-center justify-around">
      <button onclick="appState.switchTab('today')" id="nav-today" class="flex flex-col items-center justify-center py-1 px-3 rounded-2xl apple-press transition-colors">
        <i data-lucide="sun" class="w-5 h-5 mb-1"></i>
        <span class="text-[11px] font-semibold tracking-tight">Hari Ini</span>
      </button>

      <button onclick="appState.switchTab('timeline')" id="nav-timeline" class="flex flex-col items-center justify-center py-1 px-3 rounded-2xl apple-press transition-colors">
        <i data-lucide="calendar" class="w-5 h-5 mb-1"></i>
        <span class="text-[11px] font-semibold tracking-tight">Linimasa</span>
      </button>

      <button onclick="appState.switchTab('repeat')" id="nav-repeat" class="flex flex-col items-center justify-center py-1 px-3 rounded-2xl apple-press transition-colors">
        <i data-lucide="repeat" class="w-5 h-5 mb-1"></i>
        <span class="text-[11px] font-semibold tracking-tight">Repetisi</span>
      </button>

      <button onclick="appState.switchTab('awareness')" id="nav-awareness" class="flex flex-col items-center justify-center py-1 px-3 rounded-2xl apple-press transition-colors">
        <i data-lucide="eye" class="w-5 h-5 mb-1"></i>
        <span class="text-[11px] font-semibold tracking-tight">Kesadaran</span>
      </button>
    </nav>

    <!-- Global Modals & Overlays Container -->
    <div id="modal-container" class="relative z-50"></div>

  </div>

  <!-- Application Logic & State Engine -->
  <script>
    // ────────────────────────────────────────────────────────────────────────
    // 1. Data Schema & Seed Engine
    // ────────────────────────────────────────────────────────────────────────

    const DEFAULT_HABITS = [
      {
        id: 'habit-1',
        title: 'Fokus Coding (LKS)',
        emoji: '💻',
        type: 'timed',
        categoryBadge: 'Fokus',
        targetLabel: '45 min',
        durationMinutes: 45,
        targetCount: 1,
        allowedApps: ['VS Code', 'Terminal', 'Documentation', 'Spotify'],
        color: 'green',
        accumulatedDays: 4,
        accumulatedValueLabel: '4 hari (3h)',
        sessionsLast30Days: 4,
      },
      {
        id: 'habit-2',
        title: 'Kalaam 1 Course',
        emoji: '📖',
        type: 'count',
        categoryBadge: 'Hitung',
        targetLabel: '1x Selesai',
        targetCount: 1,
        color: 'purple',
        accumulatedDays: 4,
        accumulatedValueLabel: '4 hari (4 m)',
        sessionsLast30Days: 4,
      },
      {
        id: 'habit-3',
        title: 'Senin • Push Up',
        emoji: '🏋️',
        type: 'bodybuilding',
        categoryBadge: 'Rutin',
        targetLabel: '20x repetisi',
        targetCount: 20,
        color: 'yellow',
        accumulatedDays: 3,
        accumulatedValueLabel: '3 hari (1h)',
        sessionsLast30Days: 3,
      },
      {
        id: 'habit-4',
        title: 'Plank & Core',
        emoji: '⚡',
        type: 'hybrid',
        categoryBadge: 'Hybrid',
        targetLabel: '3 Set @ 60s',
        targetCount: 3,
        durationMinutes: 3,
        color: 'pink',
        accumulatedDays: 4,
        accumulatedValueLabel: '4 hari (12 m)',
        sessionsLast30Days: 4,
      },
      {
        id: 'habit-5',
        title: 'Sapa Burung / Mindful',
        emoji: '🕊️',
        type: 'count',
        categoryBadge: 'Hitung',
        targetLabel: '1x Selesai',
        targetCount: 1,
        color: 'cyan',
        accumulatedDays: 3,
        accumulatedValueLabel: '3 hari (3 m)',
        sessionsLast30Days: 3,
      }
    ];

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // Pre-seed logs for today: 3 done, 2 pending
    function getDefaultLogs() {
      const today = getTodayString();
      return {
        [`${today}_habit-1`]: { date: today, habitId: 'habit-1', status: 'done', completedValueLabel: '45 min Selesai' },
        [`${today}_habit-2`]: { date: today, habitId: 'habit-2', status: 'done', completedValueLabel: '1x Selesai' },
        [`${today}_habit-3`]: { date: today, habitId: 'habit-3', status: 'done', completedValueLabel: '20x Selesai' },
        [`${today}_habit-4`]: { date: today, habitId: 'habit-4', status: 'pending' },
        [`${today}_habit-5`]: { date: today, habitId: 'habit-5', status: 'pending' },
      };
    }

    // ────────────────────────────────────────────────────────────────────────
    // 2. State Store (LocalStorage Reactive System)
    // ────────────────────────────────────────────────────────────────────────

    class AppStateStore {
      constructor() {
        this.activeTab = 'today';
        this.selectedDate = getTodayString();
        this.weekOffset = 0; // 0 = current week
        this.timerInterval = null;
        this.activeTimer = null; // { habit, remainingSeconds, isRunning, totalSeconds }
        
        // Load data from localStorage or seed
        this.loadStorage();

        // Start clock
        setInterval(() => this.updateClock(), 1000);
      }

      loadStorage() {
        try {
          const storedHabits = localStorage.getItem('sadar_habits_v1');
          this.habits = storedHabits ? JSON.parse(storedHabits) : DEFAULT_HABITS;

          const storedLogs = localStorage.getItem('sadar_logs_v1');
          this.logs = storedLogs ? JSON.parse(storedLogs) : getDefaultLogs();

          const storedReflections = localStorage.getItem('sadar_reflections_v1');
          this.reflections = storedReflections ? JSON.parse(storedReflections) : {
            [getTodayString()]: {
              date: getTodayString(),
              mood: 'good',
              proudOf: 'Menjaga konsistensi coding dan push up sebelum zuhur.',
              optionalNote: 'Pikiran terasa tenang dan tidak terburu-buru.'
            }
          };

          this.userName = localStorage.getItem('sadar_user_name_v1') || 'Zafir';
        } catch (e) {
          console.error('Storage error, falling back to defaults:', e);
          this.habits = DEFAULT_HABITS;
          this.logs = getDefaultLogs();
          this.reflections = {};
          this.userName = 'Zafir';
        }
      }

      saveStorage() {
        try {
          localStorage.setItem('sadar_habits_v1', JSON.stringify(this.habits));
          localStorage.setItem('sadar_logs_v1', JSON.stringify(this.logs));
          localStorage.setItem('sadar_reflections_v1', JSON.stringify(this.reflections));
          localStorage.setItem('sadar_user_name_v1', this.userName);
        } catch (e) {
          console.error('Failed to write to localStorage:', e);
        }
      }

      getHabitLog(date, habitId) {
        return this.logs[`${date}_${habitId}`] || { date, habitId, status: 'pending' };
      }

      setHabitStatus(date, habitId, status, note, completedValueLabel) {
        const key = `${date}_${habitId}`;
        const existing = this.logs[key] || { date, habitId };
        const prevStatus = existing.status;
        
        existing.status = status;
        if (note !== undefined) existing.note = note;
        if (completedValueLabel !== undefined) existing.completedValueLabel = completedValueLabel;
        
        this.logs[key] = existing;

        // If today and newly marked done, dynamically increment accumulation proof!
        if (date === getTodayString()) {
          const habit = this.habits.find(h => h.id === habitId);
          if (habit) {
            if (status === 'done' && prevStatus !== 'done') {
              habit.sessionsLast30Days += 1;
              habit.accumulatedDays += 1;
            } else if (status !== 'done' && prevStatus === 'done') {
              habit.sessionsLast30Days = Math.max(0, habit.sessionsLast30Days - 1);
              habit.accumulatedDays = Math.max(0, habit.accumulatedDays - 1);
            }
          }
        }

        this.saveStorage();
        this.render();
      }

      getTodayStats() {
        const today = getTodayString();
        let completed = 0;
        this.habits.forEach(h => {
          const log = this.getHabitLog(today, h.id);
          if (log.status === 'done') completed++;
        });
        return { completed, total: this.habits.length };
      }

      switchTab(tab) {
        this.activeTab = tab;
        this.render();
      }

      setUserName(name) {
        this.userName = name.trim() || 'Zafir';
        this.saveStorage();
        this.render();
      }

      // Web Vibration tactile feedback — fires on the same frame as the visual commit
      haptic(type = 'light') {
        if (!navigator.vibrate) return;
        navigator.vibrate(type === 'success' ? [10, 30, 10] : type === 'error' ? [40, 20, 40] : 10);
      }

      // ──────────────────────────────────────────────────────────────────────
      // 3. Render Engine
      // ──────────────────────────────────────────────────────────────────────
      render() {
        const container = document.getElementById('tab-content');
        if (!container) return;

        // Update Nav Highlights
        ['today', 'timeline', 'repeat', 'awareness'].forEach(tab => {
          const btn = document.getElementById(`nav-${tab}`);
          if (btn) {
            if (this.activeTab === tab) {
              btn.className = 'flex flex-col items-center justify-center py-1 px-3 rounded-2xl apple-press text-gold bg-gold/15 transition-colors';
            } else {
              btn.className = 'flex flex-col items-center justify-center py-1 px-3 rounded-2xl apple-press text-textMuted hover:text-textPrimary transition-colors';
            }
          }
        });

        // Render Active Tab View
        switch (this.activeTab) {
          case 'today':
            container.innerHTML = this.renderTodayView();
            break;
          case 'timeline':
            container.innerHTML = this.renderTimelineView();
            break;
          case 'repeat':
            container.innerHTML = this.renderRepeatView();
            break;
          case 'awareness':
            container.innerHTML = this.renderAwarenessView();
            break;
        }

        // Initialize Lucide icons on fresh DOM
        lucide.createIcons();
      }

      // ── Tab 1: Hari Ini ──────────────────────────────────────────────────
      renderTodayView() {
        const today = getTodayString();
        const stats = this.getTodayStats();
        const reflection = this.reflections[today];

        // Dynamic Greeting based on current hour
        const hour = new Date().getHours();
        let greeting = 'Selamat pagi';
        if (hour >= 11 && hour < 15) greeting = 'Selamat siang';
        else if (hour >= 15 && hour < 18) greeting = 'Selamat sore';
        else if (hour >= 18) greeting = 'Selamat malam';

        return `
          <div class="space-y-4">
            <!-- Header Sapaan Personal -->
            <div class="px-1 pt-1 pb-2">
              <div class="flex items-center space-x-1 cursor-pointer group" onclick="appState.editUserNamePrompt()">
                <h2 class="text-2xl font-bold tracking-tight text-textPrimary">${greeting}, <span class="text-gold border-b border-gold/40 border-dashed">${this.userName}</span></h2>
                <i data-lucide="edit-3" class="w-3.5 h-3.5 text-textMuted group-hover:text-gold opacity-60"></i>
              </div>
              <p class="text-xs text-textMuted font-serif italic mt-0.5 tracking-wide">"How do you want to live today?"</p>
            </div>

            <!-- Section Header: TODAY & Indicator -->
            <div class="flex items-center justify-between px-1">
              <span class="text-[11px] font-bold tracking-widest text-textMuted uppercase">TODAY</span>
              <div class="flex items-center space-x-3">
                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full apple-glass border border-gold/30 text-gold font-mono">${stats.completed} / ${stats.total} done</span>
                <button onclick="appState.openAddHabitModal()" class="text-xs font-semibold text-gold hover:underline flex items-center space-x-1 apple-press">
                  <span>+ Add</span>
                </button>
              </div>
            </div>

            <!-- Habit List Cards -->
            <div class="space-y-3">
              ${this.habits.map(habit => {
                const log = this.getHabitLog(today, habit.id);
                const isDone = log.status === 'done';
                const isSkipped = log.status === 'skipped';

                // Category badge colors
                const catColorMap = {
                  'Fokus': 'bg-amber-500/15 text-amber-300 border-amber-500/30',
                  'Hitung': 'bg-blue-500/15 text-blue-300 border-blue-500/30',
                  'Rutin': 'bg-yellow-500/15 text-yellow-300 border-yellow-500/30',
                  'Hybrid': 'bg-pink-500/15 text-pink-300 border-pink-500/30',
                };
                const catClass = catColorMap[habit.categoryBadge] || 'bg-gold/15 text-gold border-gold/30';

                return `
                  <div class="bg-surface rounded-2xl p-4 border border-surfaceBorder apple-press transition-all ${isDone ? 'opacity-90' : ''}">
                    <div class="flex items-center justify-between">
                      <!-- Left: Checkbox + Title -->
                      <div class="flex items-center space-x-3.5 flex-1 cursor-pointer" onclick="appState.toggleHabitDone('${today}', '${habit.id}')">
                        <div class="w-6 h-6 rounded-lg flex items-center justify-center transition-all ${isDone ? 'bg-statusSuccess text-black shadow-md shadow-statusSuccess/30' : 'border-2 border-surfaceBorder bg-bgPrimary/60'}">
                          ${isDone ? '<i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>' : ''}
                        </div>
                        <div class="flex-1 min-w-0">
                          <div class="flex items-center space-x-2">
                            <span class="text-base">${habit.emoji}</span>
                            <h3 class="text-sm font-semibold truncate ${isDone ? 'line-through text-textMuted' : 'text-textPrimary'}">${habit.title}</h3>
                          </div>
                          <!-- Metadata line -->
                          <div class="flex items-center space-x-2 mt-1">
                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md border ${catClass}">${habit.categoryBadge}</span>
                            <span class="text-[11px] text-textMuted font-mono">${habit.targetLabel}</span>
                            ${isDone ? `<span class="text-[10px] font-medium text-statusSuccess bg-statusSuccess/10 px-1.5 py-0.5 rounded border border-statusSuccess/20">${log.completedValueLabel || 'Selesai'}</span>` : ''}
                            ${isSkipped ? `<span class="text-[10px] font-medium text-statusSkip bg-statusSkip/10 px-1.5 py-0.5 rounded border border-statusSkip/20">Dilewati</span>` : ''}
                          </div>
                        </div>
                      </div>

                      <!-- Right: Context Action Button -->
                      <button onclick="appState.openContextMenu(event, '${habit.id}')" class="p-1.5 text-textMuted hover:text-textPrimary apple-press rounded-lg">
                        <i data-lucide="more-vertical" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Section Refleksi Harian -->
            <div onclick="appState.openReflectionModal('${today}')" class="apple-glass rounded-2xl p-4 border border-surfaceBorder cursor-pointer apple-press group hover:border-gold/40">
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                  <span class="text-lg">🤍</span>
                  <div>
                    <h4 class="text-sm font-bold text-textPrimary">Refleksi Hari Ini</h4>
                    <p class="text-xs text-textMuted font-serif italic">${reflection ? reflection.proudOf : 'Rasa hari ini • Klik untuk mencatat kebanggaan'}</p>
                  </div>
                </div>
                ${reflection ? `
                  <span class="text-xs px-2.5 py-1 rounded-full bg-gold/15 text-gold border border-gold/30 font-semibold flex items-center space-x-1">
                    <span>${this.getMoodEmoji(reflection.mood)}</span>
                    <span class="capitalize">${reflection.mood}</span>
                  </span>
                ` : `
                  <i data-lucide="chevron-right" class="w-4 h-4 text-textMuted group-hover:text-gold transition-colors"></i>
                `}
              </div>
            </div>

            <!-- Real-Time Digital Clock Widget -->
            <div class="pt-3 pb-1 flex flex-col items-center justify-center">
              <div id="live-digital-clock" class="text-2xl font-bold font-mono tracking-wider text-textMuted/80 tabular-nums">
                ${this.getCurrentTimeFormatted()}
              </div>
              <span class="text-[10px] tracking-widest uppercase text-textMuted/50 mt-0.5">Waktu Nyata</span>
            </div>
          </div>
        `;
      }

      // ── Tab 2: Linimasa ──────────────────────────────────────────────────
      renderTimelineView() {
        const today = getTodayString();
        const selected = this.selectedDate;
        const stats = this.getTodayStats();
        
        // Build 7-day week items based on weekOffset
        const days = this.getWeekDays(this.weekOffset);
        const weekLabel = this.getWeekRangeLabel(days);

        return `
          <div class="space-y-4">
            <!-- Kartu Evaluasi Harian -->
            <div class="apple-glass rounded-2xl p-4 border border-surfaceBorder space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-textPrimary font-mono">${this.formatDateLong(selected)}</h3>
                ${selected === today ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gold/20 text-gold border border-gold/40 tracking-wider">HARI INI</span>` : ''}
              </div>
              <p class="text-sm font-serif italic text-textMuted tracking-wide leading-relaxed">
                “Did I live today in a way I can be proud of?”
              </p>
              
              <!-- Gold Progress Bar -->
              <div class="space-y-1.5 pt-1">
                <div class="flex justify-between text-xs">
                  <span class="text-textPrimary font-semibold font-mono">${stats.completed} / ${stats.total} tindakan bermakna terlaksana</span>
                  <span class="text-gold font-bold">${stats.completed >= stats.total ? 'Purna' : 'Membangun Hari'}</span>
                </div>
                <div class="w-full h-2 rounded-full bg-bgPrimary overflow-hidden border border-surfaceBorder/40">
                  <div class="h-full bg-gradient-to-r from-gold to-goldLight rounded-full transition-all duration-500" style="width: ${(stats.completed / Math.max(1, stats.total)) * 100}%"></div>

      // ── Tab 4: Kesadaran ─────────────────────────────────────────────────
      renderAwarenessView() {
        // Smart diagnostic check: check if any habit skipped/failed >= 2 times
        let neglectedCount = 0;
        let neglectedNames = [];
        this.habits.forEach(h => {
          let fails = 0;
          Object.values(this.logs).forEach(log => {
            if (log.habitId === h.id && (log.status === 'failed' || log.status === 'skipped')) fails++;
          });
          if (fails >= 2) {
            neglectedCount++;
            neglectedNames.push(h.title);
          }
        });

        return `
          <div class="space-y-4">
            <!-- Header Prinsip Kesadaran -->
            <div class="apple-glass rounded-2xl p-4 border border-surfaceBorder space-y-2">
              <div class="flex items-center space-x-2 text-gold">
                <i data-lucide="eye" class="w-5 h-5"></i>
                <h3 class="text-xs font-extrabold tracking-widest uppercase">PRINSIP KESADARAN</h3>
              </div>
              <p class="text-sm font-serif italic text-textPrimary leading-snug">
                “Until you make the unconscious conscious, it will direct your life and you will call it fate.”
              </p>
              <p class="text-xs text-textMuted leading-relaxed">
                Aplikasi ini hadir bukan untuk menghakimimu, melainkan untuk menyadarkan pola nyata yang berulang dalam hidupmu.

              <div class="space-y-2.5">
                ${this.habits.map(habit => {
                  return `
                    <div class="bg-surface rounded-2xl p-3.5 border border-surfaceBorder flex items-center justify-between">
                      <div class="flex items-center space-x-3">
                        <span class="text-xl">${habit.emoji}</span>
                        <div>
                          <h4 class="text-xs font-bold text-textPrimary">${habit.title}</h4>
                          <span class="text-[11px] text-textMuted font-mono">${habit.sessionsLast30Days} sesi terpenuhi (30 hari terakhir)</span>
                        </div>
                      </div>
                      <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-statusSuccess/15 text-statusSuccess border border-statusSuccess/30 font-mono">
                        ${habit.sessionsLast30Days} ✓
                      </span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Section: POLA YANG MEMBUTUHKAN PERHATIAN -->
            <div class="space-y-2 pt-1">
              <h4 class="text-xs font-bold tracking-wider text-textMuted uppercase px-1">POLA YANG MEMBUTUHKAN PERHATIAN</h4>

              ${neglectedCount === 0 ? `
                <div class="bg-statusSuccess/10 rounded-2xl p-4 border border-statusSuccess/30 flex items-start space-x-3">
                  <i data-lucide="check-circle" class="w-5 h-5 text-statusSuccess shrink-0 mt-0.5"></i>
                  <p class="text-xs text-textPrimary leading-relaxed">
                    <span class="font-bold text-statusSuccess">Ritme Stabil:</span> Semua kebiasaan berjalan dengan ritme yang tenang minggu ini. Pertahankan ketenangan dan kesadaranmu.
                  </p>
                </div>
              ` : `
                <div class="bg-statusFail/10 rounded-2xl p-4 border border-statusFail/30 flex items-start space-x-3">
                  <i data-lucide="alert-triangle" class="w-5 h-5 text-statusFail shrink-0 mt-0.5"></i>
                  <div class="text-xs text-textPrimary leading-relaxed">
                    <span class="font-bold text-statusFail">Perlu Perhatian Lembut:</span> Kebiasaan <span class="font-semibold underline">${neglectedNames.join(', ')}</span> sempat terlewat beberapa kali. Kembali sadari tanpa menghakimi diri sendiri.
                  </div>
                </div>
              `}
            </div>
          </div>
        `;
      }

      toggleHabitDone(date, habitId) {
        const log = this.getHabitLog(date, habitId);
        const nextStatus = log.status === 'done' ? 'pending' : 'done';
        const habit = this.habits.find(h => h.id === habitId);
        const valLabel = habit ? habit.targetLabel + ' Selesai' : 'Selesai';
        this.setHabitStatus(date, habitId, nextStatus, undefined, valLabel);
        this.haptic('light');
      }

      openContextMenu(e, habitId) {
        e.stopPropagation();
        const habit = this.habits.find(h => h.id === habitId);
        if (!habit) return;

        const container = document.getElementById('modal-container');
        container.innerHTML = `

                <span>${habit.emoji}</span>
                <span>${habit.title}</span>
              </h3>
              <button onclick="appState.closeModal(); appState.startFocusTimer('${habit.id}')" class="w-full p-3 rounded-xl bg-surface border border-surfaceBorder text-left text-sm font-semibold flex items-center space-x-3 text-gold apple-press">

                <span>Mulai Timer Fokus</span>
              </button>
              <button onclick="appState.closeModal(); appState.setHabitStatus('${getTodayString()}', '${habit.id}', 'skipped')" class="w-full p-3 rounded-xl bg-surface border border-surfaceBorder text-left text-sm font-semibold flex items-center space-x-3 text-statusSkip apple-press">
                <i data-lucide="skip-forward" class="w-4 h-4"></i>
                <span>Tandai Lewati (Skip) Hari Ini</span>
              </button>
              <button onclick="appState.deleteHabit('${habit.id}')" class="w-full p-3 rounded-xl bg-surface border border-surfaceBorder text-left text-sm font-semibold flex items-center space-x-3 text-statusFail apple-press">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                <span>Hapus Kebiasaan</span>
              </button>
            </div>
          </div>
        `;
        lucide.createIcons();

      openAddHabitModal() {

          { name: 'green', hex: '#22C55E' },
          { name: 'purple', hex: '#A855F7' },
          { name: 'yellow', hex: '#EAB308' },
          { name: 'pink', hex: '#EC4899' },
          { name: 'cyan', hex: '#06B6D4' },
          { name: 'blue', hex: '#3B82F6' },
          { name: 'amber', hex: '#D4A359' },
        ];

      selectModalEmoji(em) {
        this.selectedNewEmoji = em;
        document.querySelectorAll('.emoji-btn').forEach(btn => {
          if (btn.dataset.emoji === em) {
            btn.className = 'emoji-btn text-xl p-2 rounded-xl border border-gold bg-gold/15 apple-press';
          } else {
            btn.className = 'emoji-btn text-xl p-2 rounded-xl border border-surfaceBorder bg-surface hover:border-gold/60 apple-press';
          }
        });
      }

      selectModalColor(colorName) {
        this.selectedNewColor = colorName;
        document.querySelectorAll('.color-btn').forEach(btn => {
          if (btn.dataset.color === colorName) {
            btn.classList.add('border-white', 'scale-110');
            btn.classList.remove('border-transparent');
          } else {
            btn.classList.remove('border-white', 'scale-110');
            btn.classList.add('border-transparent');
          }
        });
      }

      selectHabitType(type) {
        this.selectedNewType = type;
        ['timed', 'count', 'bodybuilding', 'hybrid'].forEach(t => {
          const btn = document.getElementById(`type-btn-${t}`);
          if (btn) {
            if (t === type) {
              btn.className = 'py-2 text-xs font-bold rounded-lg bg-surface text-gold border border-gold/40 apple-press';
            } else {
              btn.className = 'py-2 text-xs font-bold rounded-lg text-textMuted hover:text-textPrimary apple-press';
            }
          }
        });

        const dyn = document.getElementById('dynamic-habit-input');
        if (!dyn) return;

        if (type === 'timed') {

      // ── Layar Mode Timer Fokus ─────────────────────────────────────────────
      startFocusTimer(habitId) {
        const habit = this.habits.find(h => h.id === habitId);
        if (!habit) return;

        const durationMinutes = habit.durationMinutes || 25;
        this.activeTimer = {
          habit,
          totalSeconds: durationMinutes * 60,
          remainingSeconds: durationMinutes * 60,
          isRunning: true,
        };

        if (this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => {
          if (this.activeTimer && this.activeTimer.isRunning) {
            this.activeTimer.remainingSeconds--;
            if (this.activeTimer.remainingSeconds <= 0) {
              clearInterval(this.timerInterval);
              this.activeTimer.remainingSeconds = 0;
              this.completeFocusTimer();
            } else {
              this.updateTimerDisplay();
            }
          }
        }, 1000);

        this.renderFocusTimerOverlay();
      }

        const container = document.getElementById('modal-container');
        const habit = this.activeTimer.habit;
        const apps = habit.allowedApps || ['VS Code', 'Notion', 'Documentation'];

        container.innerHTML = `

                </svg>

                  <span class="text-[10px] font-serif italic text-textMuted mt-1 tracking-wide">"Stay with it. Fulfill your day."</span>

              </div>
            </div>

            <!-- Control Buttons -->
            <div class="space-y-2.5">
              <div class="flex items-center space-x-3">
                <button id="timer-toggle-btn" onclick="appState.toggleTimerPause()" class="flex-1 py-3.5 rounded-2xl apple-glass border border-surfaceBorder text-textPrimary font-bold text-sm apple-press flex items-center justify-center space-x-1.5">

                  <span id="timer-toggle-label">Jeda</span>
                </button>
                <button onclick="appState.completeFocusTimer()" class="flex-1 py-3.5 rounded-2xl bg-gold text-black font-extrabold text-sm apple-press flex items-center justify-center space-x-1.5 shadow-lg shadow-gold/20">

      updateTimerDisplay() {
        const textEl = document.getElementById('timer-countdown-text');
        const circleEl = document.getElementById('timer-progress-circle');
        if (!textEl || !circleEl || !this.activeTimer) return;

        textEl.innerText = this.formatTimerSeconds(this.activeTimer.remainingSeconds);

        const total = this.activeTimer.totalSeconds;
        const left = this.activeTimer.remainingSeconds;
        const circumference = 276.46; // 2 * pi * 44
        const offset = circumference - (left / total) * circumference;
        circleEl.style.strokeDashoffset = offset;
      }

      toggleTimerPause() {
        if (!this.activeTimer) return;
        this.activeTimer.isRunning = !this.activeTimer.isRunning;
        const btn = document.getElementById('timer-toggle-label');
        if (btn) btn.innerText = this.activeTimer.isRunning ? 'Jeda' : 'Lanjut';
      }

      completeFocusTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        const habitId = this.activeTimer ? this.activeTimer.habit.id : null;
        if (habitId) {
          this.setHabitStatus(getTodayString(), habitId, 'done', undefined, 'Fokus Selesai');

        this.activeTimer = null;
        this.haptic('success');
        this.closeModal();

      selectDate(dateStr) {

      changeWeek(delta) {
        this.weekOffset += delta;

      getWeekDays(offsetWeeks = 0) {
        const now = new Date();
        const dayOfWeek = now.getDay(); // 0 is Sunday
        const mondayOffset = (dayOfWeek === 0 ? -6 : 1) - dayOfWeek + (offsetWeeks * 7);
        const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + mondayOffset);

        const days = [];
        const names = ['SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB', 'MIN'];
        for (let i = 0; i < 7; i++) {
          const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
          const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          days.push({
            dateStr,
            dayName: names[i],
            dayNum: d.getDate(),
          });
        }
        return days;
      }

      getWeekRangeLabel(days) {
        if (!days || days.length < 7) return 'Minggu Ini';
        const start = days[0];
        const end = days[6];
        return `Minggu (${start.dayNum} - ${end.dayNum} Okt 2026)`;
      }

      formatDateLong(dateStr) {
        const parts = dateStr.split('-');
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        const dayNames = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        return `${dayNames[d.getDay()]}, ${d.getDate()} ${monthNames[d.getMonth()]}`;
      }

      formatDateShort(dateStr) {
        const parts = dateStr.split('-');
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
        return `${dayNames[d.getDay()]}, ${d.getDate()}/${parts[1]}`;
      }

      getMoodEmoji(mood) {
        switch (mood) {
          case 'reflecting': return '🌧️';
          case 'okay': return '☁️';
          case 'good': return '🌿';
          case 'proud': return '🌟';
          default: return '🌿';
        }
      }

      formatTimerSeconds(totalSecs) {
        const m = Math.floor(totalSecs / 60);
        const s = totalSecs % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      getCurrentTimeFormatted() {
        const d = new Date();
        let hours = d.getHours();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const seconds = String(d.getSeconds()).padStart(2, '0');
        return `${hours}:${minutes}:${seconds} ${ampm}`;
      }

      updateClock() {
        const el = document.getElementById('live-digital-clock');
        if (el) el.innerText = this.getCurrentTimeFormatted();
      }
    }

    // Web Vibration: light tactile tap on every interactive button (same frame as visual press)
    document.addEventListener('pointerdown', (e) => {
      const btn = e.target.closest('button');
      if (btn && !btn.disabled && navigator.vibrate) {
        navigator.vibrate(10);
      }
    }, { passive: true });

    // Initialize Global App Instance
    const appState = new AppStateStore();
    window.appState = appState;
    appState.render();
  </script>
</body>
</html>
